# Fuel: GLM-5.3-Flash
#
# Every number here is copied from a published entry, never estimated in this
# file. Each block names its source:
#   [fuel]  blog/fuels/glm-5.3-flash.qmd
#   [bw]    blog/posts/hardware/2026-09-06-measured-bandwidth/
#   [base]  blog/posts/hardware/2026-09-05-spark-cluster-baseline/
# Values marked `derived: true` are arithmetic on a cited number, not a new
# measurement.

id: glm-5.3-flash
chemistry: glm5-moe-288e-top8-kda-dsa   # [fuel]
status: unburned                         # no engine burns it yet [fuel]
page: blog/fuels/glm-5.3-flash.qmd

parameters:                              # [fuel]
  total: 321e9
  active_per_token: 18e9

architecture:                            # [fuel]
  text_layers: 45
  vision_encoder_layers: 24
  context_tokens: 1048576
  serving_context_cap: 262144            # operator decision 2026-09-06: 262k is enough for agentic work; sizes KV budget and DSA indexer scan, model max stays above
  attention:
    kda_linear_layers: 34                # approximate in the source
    sparse_mla_layers: every_4th
    mla_positional: nope
    dsa_indexer_top_k: 2048
  moe:
    routed_experts: 288
    top_k: 8
  speculation:
    native: mtp_draft_layer
    external_drafter: incoai/GLM-5.3-Flash-DFlash2

# Two parts, both required to resume a sequence (blog/rocket.qmd#state) [fuel].
reusable_state:
  - name: sparse_mla_kv
    growth: with_sequence_length
  - name: kda_recurrent
    growth: fixed_per_sequence
    reconstructible_from_kv: false
  - name: mtp_draft_sparse_mla_kv
    growth: with_sequence_length
    active_only_when: speculative_decoding_enabled
    note: >
      Layer 45, the MTP draft layer, is a 12th sparse_mla-shaped layer, not
      an addition to the 11 counted above (attention.yaml, layers.mtp_layer_id
      45, mtp_layer_kind sparse_mla: "layer 45 carries kv_a_proj_with_mqa,
      kv_b_proj, q_a/q_b, indexer and eh_proj, so the draft layer is
      MLA-shaped and has its own KV cache when speculation is on"). It carries
      its own MLA latent cache (512-wide, same shape as the other 11) and its
      own indexer tensors (wk, wq_b, weights_proj), so it can run its own
      indexer key+gate cache too. config.json's index_share_for_mtp_iteration
      is true, meaning the reference reuses the trunk's already-computed
      top-k *indices* for the draft step instead of re-scanning -- but that
      sharing is itself unimplemented in at least one public port: ggml-org/
      llama.cpp PR #27752 states "index_share_for_mtp_iteration is not
      implemented. The reference shares the trunk index for the MTP step,
      which a separate MTP context cannot see, so the draft head attends
      densely." An engine that does not implement the cross-context index
      share therefore still needs layer 45's own indexer key+gate cache, not
      just its MLA latent cache, to run it sparsely rather than densely.
      Per-stream cost of adding this 12th cache at the 262144-token serving
      cap (attention.yaml, per_stream_at_262144, bf16_with_mtp minus
      bf16_no_mtp): +268435456 B (0.25 GiB) of MLA latent and +134217728 B
      (0.125 GiB) of indexer key+gate, both exact because 262144 = 2^18:
      262144*1024/2^30 = 0.25, 262144*512/2^30 = 0.125. Total +0.375 GiB per
      stream, which is why streams_in_60gib_kv_budget drops from 14
      (bf16_no_mtp) to 13 (bf16_with_mtp) in attention.yaml.

weight_formats:                          # [fuel]
  - name: fp8_native
    bits_per_weight: 8
    total_bytes_gib: 306
    fits_one_booster: false              # booster is 123.73 GiB [base]
    fits_two_boosters: false
  - name: nvfp4
    bits_per_weight: 4                   # 4-bit experts, ~4.25 effective [fuel]
    effective_bits_per_weight: 4.25
    total_bytes_gib: 182
    fits_one_booster: false
    fits_two_boosters: true
    per_booster_gib: 91                  # 182 / 2
    derived: true
  - name: exl3_4bpw
    bits_per_weight: 4
    total_bytes_gib: 164
    fits_one_booster: false
    fits_two_boosters: true
    on_disk: Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw

minimum_boosters: 2                      # no format fits one booster [fuel]

# The engine target is concurrent agent and subagent serving: many parallel
# streams, forked prefixes, bursty tool-result prefills. Weight traffic per
# step is bounded below by one token's active set and above by the whole
# resident expert set, and concurrency moves it toward the upper bound.
serving_regime:
  concurrency_first: true
  weight_traffic:
    single_token_active_gib: 9.6         # 18B active at ~4.25 bits [fuel][bw]
    single_token_per_booster_gib: 4.8    # split across two [bw]
    # Only 8 of 288 experts fire per token, so tokens that share experts
    # amortize the read [fuel]. As concurrent streams rise, the union of
    # experts fired per step approaches all 288 and per-step weight traffic
    # approaches the resident set rather than the per-token active set.
    concurrent_step_upper_bound_gib: 182 # nvfp4 resident set [fuel]
    amortization_lever: expert_reuse_across_concurrent_tokens
  # Recorded because published stacks are measured there, not because it is
  # what this engine optimizes.
  single_stream_reference:
    ceiling_tok_s: 49.6                  # 238 GB/s per booster, split pair [bw]
    measured_best_stack_tok_s: 25.4      # vLLM EXL3 4bpw + DFlash2 k=7 TP=2 [bw]
