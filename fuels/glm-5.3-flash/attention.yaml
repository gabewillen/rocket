# Fuel: GLM-5.3-Flash, attention geometry
#
# Every dimension here is read off the on-disk NVFP4 checkpoint, never inferred
# from a model card. Each block names its source:
#   [cfg]    config.json text_config, NIM snapshot nim-aa28e1f-nvfp4
#   [shape]  safetensors header shapes, scripts/attention/dump-attention-shapes.py
#   [cap]    fuels/glm-5.3-flash/fuel.yaml serving_context_cap
#   [bench]  blog/posts/attention/2026-09-06-dsa-indexer-is-the-attention-cost/
# Values marked `derived: true` are arithmetic on a cited number.
# Values marked `established: false` could not be settled from on-disk sources
# and say so instead of guessing.
#
# Checkpoint:
#   ~/.cache/nim-glm53-2.1.2/ngc/hub/models--nim--zai-org--glm-5.3-flash/
#     snapshots/nim-aa28e1f-nvfp4/
# Vision encoder ignored throughout (config.json vision_config, 24 layers).

id: glm-5.3-flash
hidden_size: 4096                        # [cfg] hidden_size
text_layers: 45                          # [cfg] num_hidden_layers

# ---------------------------------------------------------------- interleave
# config.json carries the pattern three ways and all three agree: layer_types,
# linear_attn_config.kda_layers, and linear_attn_config.full_attn_layers.
layers:                                   # [cfg]
  pattern: three_kda_then_one_mla
  kda_layer_ids: [0,1,2, 4,5,6, 8,9,10, 12,13,14, 16,17,18, 20,21,22,
                  24,25,26, 28,29,30, 32,33,34, 36,37,38, 40,41,42, 44]
  mla_layer_ids: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43]
  kda_count: 34
  mla_count: 11
  # Layer 44 is KDA and the run ends there, so the last block is a triple of
  # KDA with no MLA after it. The interleave is exact, not approximate; the
  # "~34" in fuel.yaml is confirmed as exactly 34.
  mtp_layer_id: 45                        # [shape] num_nextn_predict_layers 1
  mtp_layer_kind: sparse_mla              # [shape] layer 45 carries kv_a_proj_with_mqa,
                                          # kv_b_proj, q_a/q_b, indexer and eh_proj,
                                          # so the draft layer is MLA-shaped and has
                                          # its own KV cache when speculation is on

# ---------------------------------------------------------------------- KDA
# Kimi-delta-style linear attention. Shapes fix the state; the recurrence
# itself lives in modeling code.
kda:
  num_heads: 64                           # [cfg] linear_attn_config.num_heads
  head_dim: 128                           # [cfg] linear_attn_config.head_dim
  qkv_width: 8192                         # [shape] q/k/v_proj [8192, 4096] = 64*128
  k_is_full_width: true                   # [shape] k_proj is 8192 wide, not MQA
  v_head_dim: 128                         # [shape] v_proj [8192, 4096]
  short_conv_kernel_size: 4               # [cfg] linear_attn_config.short_conv_kernel_size
  conv_tensors: 3                         # [shape] q_conv1d, k_conv1d, v_conv1d, each [8192,1,4]
  conv_depthwise: true                    # [shape] middle dim 1
  conv_state_taps: 3                      # derived: true, kernel_size - 1
  gate_lower_bound: -5.0                  # [cfg] linear_attn_config.gate_lower_bound
  gates:                                  # [shape]
    decay:  {a: [128, 4096], b: [8192, 128], rank: 128, per: channel}   # f_a_proj / f_b_proj
    output: {a: [128, 4096], b: [8192, 128], rank: 128, per: channel}   # g_a_proj / g_b_proj
    beta:   {w: [64, 4096], per: head}                                  # b_proj
  a_log: [64]                             # [shape] F32, per head
  dt_bias: [8192]                         # [shape] F32, per channel
  o_norm: [128]                           # [shape] RMSNorm over head_dim
  o_proj: [4096, 8192]                    # [shape]
  recurrent_state_shape: [64, 128, 128]   # derived: true, heads x key dim x value dim
  recurrent_state_elements: 1048576       # derived: true
  # Not on disk: whether the engine keeps the recurrent state in BF16 or FP32.
  # It is a runtime choice, so both are carried below.
  state_dtype: {established: false, candidates: [bf16, fp32]}

# ---------------------------------------------------------------------- MLA
# NoPE throughout: qk_rope_head_dim is 0 and kv_a_proj_with_mqa is exactly
# kv_lora_rank wide, with no rope tail. That is what makes the cached latent
# 512 and not 576.
mla:
  num_heads: 64                           # [cfg] num_attention_heads
  q_lora_rank: 1536                       # [cfg], [shape] q_a_proj [1536, 4096]
  kv_lora_rank: 512                       # [cfg], [shape] kv_a_proj_with_mqa [512, 4096]
  qk_head_dim: 256                        # [cfg] qk_head_dim
  qk_nope_head_dim: 256                   # [cfg]
  qk_rope_head_dim: 0                     # [cfg]
  v_head_dim: 256                         # [cfg]
  use_nope: true                          # [cfg] mla_use_nope
  q_b_proj: [16384, 1536]                 # [shape] 64 * 256
  kv_b_proj: [32768, 512]                 # [shape] 64 * (256 nope + 256 v)
  o_proj: [4096, 16384]                   # [shape] 64 * 256
  cached_per_token: latent_only
  cached_width: 512                       # derived: true, kv_lora_rank, no rope tail
  absorbed_decode: true                   # W^K_b folds into q, so all 64 heads
                                          # score against one 512 wide latent [bench]

# -------------------------------------------------------------------- DSA
indexer:
  n_heads: 32                             # [cfg] index_n_heads
  head_dim: 128                           # [cfg] index_head_dim
  top_k: 2048                             # [cfg] index_topk
  kpool: 4                                # [cfg] index_kpool
  kpool_compress: true                    # [cfg] index_kpool_compress
  kpool_always_select_tail: true          # [cfg] index_kpool_always_select_tail
  rope_interleave: true                   # [cfg] indexer_rope_interleave
  share_for_mtp_iteration: true           # [cfg] index_share_for_mtp_iteration
  wk: [128, 4096]                         # [shape] one 128 wide key per token
  wq_b: [4096, 1536]                      # [shape] 32 * 128, from the q lora
  weights_proj: [32, 4096]                # [shape] one scalar per head
  k_norm: {weight: [128], bias: [128]}    # [shape]
  kpool_compress_gate: [128, 4096]        # [shape]
  kpool_compress_ape: [4, 128]            # [shape] one embedding per pool slot
  # Three things the checkpoint alone did not settle. All three are now
  # established from the reference implementation (priority (a)), with an
  # independent llama.cpp DSA-layer port (priority (b) analog, since neither
  # vLLM nor SGLang has glm5_next support yet per LibertAIDAI/GLM-5.3-Flash-NVFP4
  # README: "glm5_next is a brand-new architecture ... not yet in vLLM main")
  # cross-checking the same behavior, plus the DSA paper for the score formula
  # (priority (c) tie-break).
  top_k_unit:
    established: true
    unit: tokens
    note: >
      index_topk (2048) counts final gathered tokens, not pooled groups. The
      reference runs top-k over the POOL axis at a pool count of
      index_topk / index_kpool = 2048 / 4 = 512, then expands each selected
      pool to its 4 member tokens: 512 * 4 = 2048 tokens gathered, matching
      index_topk exactly. Source: ggml-org/llama.cpp PR #27754 ("model: add
      GLM-5-Next (GLM-5.3-Flash)"), citing the checkpoint's own
      modular_glm5_next.py, Glm5NextTextIndexer.forward: "Top-k runs over the
      POOL axis at select_k = index_topk/index_kpool, and the selected pools
      are expanded to their member cells through pool_cells. That is the
      reference's own two-step ... topk over the pool axis, then
      selected_indices = pool_indices[batch_idx, selected]". This confirms
      the bench's existing assumption (2048 tokens) was right; the 4x reading
      (512 tokens) does not occur anywhere in the reference.
  score_nonlinearity:
    established: true
    nonlinearity: relu
    formula: "I_t = sum_j weights_proj[j] * relu(Q_tj . K_tj^T)"
    note: >
      ReLU sits inside the per-head dot product, before the weights_proj sum
      over the 32 heads. Two independent sources agree: (1) the DSA paper
      (arXiv:2604.22312, "Guess-Verify-Refine"), section 2.1, gives the
      indexer score as "I_t = sum_{j=1}^h W_j^I . ReLU(Q_{t,j}^I(K_t^I)^T)".
      (2) ggml-org/llama.cpp PR #27754, debugging GLM-5-Next's own pooled
      top-k, states plainly for this checkpoint's indexer: "ReLU drives most
      pool scores to exactly 0.0, and ggml_top_k is explicitly unordered
      among equals, so the cut falls inside an inter-pool tie group" -- a
      behavior only possible if ReLU already sits inside the per-token score
      before pooling. The ReLU does not change scan FLOPs (it is applied
      per head before a sum any implementation must already do), so this
      only closes out the open question, it does not move any byte count.
  cached_key_form:
    established: true
    form: per_token_128_plus_gate_128
    note: >
      The reference does not store only a pooled 4-to-1 key. ggml-org/llama.cpp
      PR #27754 ("model: add GLM-5-Next (GLM-5.3-Flash)") describes the
      checkpoint's own compression as: "GLM's compressor is not a mean pool:
      it is a per-channel softmax over the kpool slots with logits gate + ape,
      where the gate is a second projection of the hidden state of width
      indexer_head_size. Caching it beside the key is the only way a pool
      survives its member tokens leaving the batch." Because the pool weight
      is a softmax over per-token gate logits (not a fixed average), the
      per-token key (128 wide, wk) AND the per-token compressor gate (128
      wide, kpool_compress_gate) must both be retained; the pooled form
      (128-wide key amortized over kpool 4 members, 32 elements / 64 bytes
      per token) quoted as a candidate in earlier drafts of this file cannot
      be reconstructed from a discarded per-token gate, so it is ruled out,
      not merely unmeasured. Same PR: "llama_memory_hybrid
      therefore gains an optional third cache holding one indexer key and one
      compressor gate per token." This doubles the earlier
      indexer_key_per_token_per_layer estimate (128 elements assumed, now
      256: key + gate), recomputed below.

# --------------------------------------------------------------- state bytes
# All arithmetic below is BF16 unless stated. Shown so it can be checked.
bytes:
  kda_state_per_stream:                   # context independent
    recurrent_per_layer: 2097152          # 64 * 128 * 128 * 2
    conv_per_layer: 147456                # 3 tensors * 8192 ch * 3 taps * 2
    per_layer_total: 2244608
    layers: 34
    total: 76316672                       # 2244608 * 34
    total_mib: 72.78125
    derived: true
    if_state_fp32:
      per_layer_total: 4341760            # 4194304 recurrent + 147456 conv
      total: 147619840
      total_mib: 140.78125

  mla_kv_per_token_per_layer: 1024        # 512 latent * 2, no rope tail
  # Settled by indexer.cached_key_form above: the reference keeps both a
  # per-token key (128 elements, wk) and a per-token compressor gate (128
  # elements, kpool_compress_gate), not the key alone. 256 elements * 2 B
  # (BF16) = 512 B/token/layer. The old 256 B/token/layer figure assumed
  # only the key and undercounted by 2x.
  indexer_key_per_token_per_layer: 512    # (128 key + 128 gate) * 2
  indexer_key_per_token_per_layer_pooled:
    established: true
    value: null
    ruled_out: true
    note: >
      Not a usable runtime option. indexer.cached_key_form settles that the
      per-token gate cannot be discarded once its pool is formed (the pool
      weight is a softmax over that gate, not a fixed average), so a 128 / 4
      = 32 element (64 B) amortized-pooled cache cannot reconstruct what the
      reference needs to keep scoring correctly as new pools form. Retained
      here as a null so a future reader does not have to re-derive why it is
      gone.

  at_serving_cap:                         # 262144 tokens [cap]
    context_tokens: 262144
    mla_latent_11_layers: 2952790016      # 11 * 262144 * 1024
    mla_latent_11_layers_gib: 2.75
    indexer_per_token_11_layers: 1476395008 # 11 * 262144 * 512
    indexer_per_token_11_layers_gib: 1.375
    derived: true

# ------------------------------------------------------------ per-stream cost
# Three accountings. indexer_keys now always uses the settled per-token
# (key + gate) form; the only remaining runtime choice is kda.state_dtype
# (fuels/glm-5.3-flash/attention.yaml, kda.state_dtype, still
# established: false), which is what tells "bf16" from "fp32" apart below.
per_stream_at_262144:
  - name: bf16_no_mtp
    assumes: [kda_state_bf16, indexer_keys_per_token, mtp_cache_not_resident]
    kda_state: 76316672
    mla_latent: 2952790016
    indexer_keys: 1476395008              # 11 * 262144 * 512
    total_bytes: 4505501696               # 76316672 + 2952790016 + 1476395008
    total_gib: 4.196075439453125
    derived: true
  - name: bf16_with_mtp
    assumes: [kda_state_bf16, indexer_keys_per_token, mtp_layer_45_cached]
    kda_state: 76316672
    mla_latent: 3221225472                # 12 layers: 12 * 262144 * 1024
    indexer_keys: 1610612736              # 12 layers: 12 * 262144 * 512
    total_bytes: 4908154880               # 76316672 + 3221225472 + 1610612736
    total_gib: 4.571075439453125
    # Delta over bf16_no_mtp from adding layer 45's cache: +268435456 B
    # (0.25 GiB) of MLA latent and +134217728 B (0.125 GiB) of indexer
    # key+gate, both exact eighths/quarters of a GiB because 262144 tokens
    # is 2^18: 262144*1024/2^30 = 0.25, 262144*512/2^30 = 0.125.
    derived: true
  - name: fp32_kda_with_mtp
    assumes: [kda_state_fp32, indexer_keys_per_token, mtp_layer_45_cached]
    kda_state: 147619840
    mla_latent: 3221225472                # 12 layers
    indexer_keys: 1610612736              # 12 layers, settled 512 B/token
    total_bytes: 4979458048               # 147619840 + 3221225472 + 1610612736
    total_gib: 4.637481689453125
    derived: true

streams_in_60gib_kv_budget:               # 64424509440 B = 60 GiB
  bf16_no_mtp: 14                         # 64424509440 / 4505501696 = 14.30
  bf16_with_mtp: 13                       # = 13.13
  fp32_kda_with_mtp: 12                   # = 12.94
  derived: true
  # Settling cached_key_form raised indexer_key_per_token_per_layer from 256
  # to 512 B, which raised every total_bytes above and dropped every stream
  # count from the previous pooled-assumption draft (20/18/15 -> 14/13/12).
  # Under the two-booster split the MLA latent and the indexer keys are head
  # independent, so they replicate on both boosters; only the KDA state
  # shards with heads. Per booster that is 2.75 (mla) + 1.375 (indexer,
  # settled) + 0.0355377 (half of 76316672 B kda_state) = 4.1605377 GiB per
  # stream, so a 60 GiB budget on each booster buys 14 streams, matching the
  # non-sharded bf16_no_mtp total above (both are dominated by the same
  # replicated mla+indexer cost; halving the small kda_state term barely
  # moves the total).
  per_booster_gib_bf16_no_mtp: 4.1605377
  streams_per_booster_bf16_no_mtp: 14     # 60 / 4.1605377 = 14.42
  # A 60 GiB KV budget is larger than this engine currently has. The booster
  # is 123.73 GiB (blog/posts/hardware/2026-09-05-spark-cluster-baseline/)
  # and the NVFP4 weights take 91 GiB of it (fuel.yaml), leaving 32.73 GiB.
  headroom_note:
    booster_gib: 123.73
    weights_per_booster_gib: 91
    kv_headroom_gib: 32.73
    streams_at_headroom: 7                # 32.73 / 4.1605377 = 7.87
    derived: true
