project:
  type: website
  output-dir: _site

website:
  title: "Rocket"
  description: "Build log for a single-model inference engine on DGX Spark"
  site-url: "https://gabewillen.github.io/rocket/"
  repo-url: "https://github.com/gabewillen/rocket"
  navbar:
    left:
      - href: index.qmd
        text: Log
      - href: experiments.qmd
        text: Experiments
      - href: rocket.qmd
        text: Rocket
      - href: fuels/index.qmd
        text: Fuels
      - href: engines/index.qmd
        text: Engines
    right:
      - icon: github
        href: https://github.com/gabewillen/rocket
  page-footer:
    center: "Rocket"

format:
  html:
    theme:
      light: [cosmo, styles/theme-light.scss]
      dark: [darkly, styles/theme-dark.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
    mainfont: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif
    monofont: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace
    fontsize: 0.95rem
    smooth-scroll: true
    date-format: "YYYY-MM-DD"
    grid:
      body-width: 780px
